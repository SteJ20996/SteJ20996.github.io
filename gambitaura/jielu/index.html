<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="借路 Jielu：GambitAura 系列的第一款雙人策略棋。走棋或搬地板，讓自己的棋子先抵達旗格。" />
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#11151d" media="(prefers-color-scheme: dark)" />
<title>借路 Jielu · GambitAura</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f5f2ec;
    --panel: #fffdf8;
    --ink: #1c2130;
    --body: #3c4252;
    --muted: #5f6676;
    --line: #e2dbcd;
    --water-a: #2f7896;
    --water-b: #1d566f;
    --tile: #efe3cb;
    --tile-hi: #faf3e3;
    --tile-lo: #d2bf9b;
    --mint: #17a37b;
    --mint-deep: #0e7a5b;
    --mint-soft: #d3f2e6;
    --coral: #e2614c;
    --coral-deep: #b9432f;
    --coral-soft: #fbdcd4;
    --gold: #e9b949;
    --focus: #2b5cd6;
    --shadow: 0 10px 40px rgba(28, 33, 48, .10);
    --sans: 'Instrument Sans', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
    --serif: 'DM Serif Display', 'Noto Serif TC', 'Songti TC', serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151d; --panel: #181d27; --ink: #eef0f5; --body: #c9cdd8; --muted: #9aa1b0; --line: #2a3140;
      --water-a: #24617b; --water-b: #153f52; --tile: #e4d6ba; --tile-hi: #f1e7d2; --tile-lo: #bda67e;
      --mint-soft: #123a30; --coral-soft: #42211b; --focus: #8fb0ff;
      --shadow: 0 10px 40px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #11151d; --panel: #181d27; --ink: #eef0f5; --body: #c9cdd8; --muted: #9aa1b0; --line: #2a3140;
    --water-a: #24617b; --water-b: #153f52; --tile: #e4d6ba; --tile-hi: #f1e7d2; --tile-lo: #bda67e;
    --mint-soft: #123a30; --coral-soft: #42211b; --focus: #8fb0ff;
    --shadow: 0 10px 40px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    min-height: 100dvh;
    padding: max(14px, env(safe-area-inset-top)) 16px 28px;
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 4px 0 14px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; }
  .wordmark { font-family: var(--serif); font-size: 1.35rem; letter-spacing: .01em; }
  .wordmark em {
    font-style: normal;
    background: linear-gradient(100deg, var(--mint) 0%, var(--gold) 50%, var(--coral) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .crumb { font-family: var(--mono); font-size: .72rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .langs { display: flex; gap: 4px; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 4px 11px; font-size: .8rem; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip:focus-visible, .btn:focus-visible, .seg button:focus-visible, .cellbtn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .game { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
  @media (max-width: 860px) { .game { grid-template-columns: 1fr; } }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .title-row { width: 100%; max-width: 560px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(1.6rem, 4vw, 2.1rem); line-height: 1.1; }
  h1 small { font-family: var(--sans); font-size: .9rem; color: var(--muted); margin-left: 6px; }
  .ver { font-family: var(--mono); font-size: .72rem; color: var(--muted); white-space: nowrap; }

  /* Board */
  .boardframe {
    width: 100%; max-width: 560px;
    display: grid; grid-template-columns: 22px 1fr; grid-template-rows: 22px 1fr; gap: 4px;
  }
  .files, .ranks { display: grid; font-family: var(--mono); font-size: .72rem; color: var(--muted); }
  .files { grid-column: 2; grid-template-columns: repeat(5, 1fr); text-align: center; align-items: end; }
  .ranks { grid-row: 2; grid-template-rows: repeat(5, 1fr); align-items: center; justify-items: center; }
  .board {
    grid-column: 2; grid-row: 2;
    position: relative; aspect-ratio: 1 / 1; width: 100%;
    border-radius: 18px; overflow: hidden;
    background:
      radial-gradient(120% 80% at 20% 10%, rgba(255,255,255,.16), transparent 60%),
      repeating-linear-gradient(170deg, rgba(255,255,255,.05) 0 2px, transparent 2px 14px),
      linear-gradient(160deg, var(--water-a), var(--water-b));
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(0,0,0,.08);
    touch-action: manipulation;
  }
  .layer { position: absolute; inset: 0; }
  .tile, .piece, .mark, .cellbtn {
    position: absolute; width: 20%; height: 20%;
    left: 0; top: 0;
    transform: translate(calc(var(--c) * 100%), calc(var(--r) * 100%));
  }
  .tile { transition: transform .42s cubic-bezier(.2,.8,.2,1); }
  .tile i {
    position: absolute; inset: 6%; border-radius: 12%;
    background: linear-gradient(155deg, var(--tile-hi), var(--tile) 55%, var(--tile-lo));
    box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.6);
    transition: box-shadow .3s, transform .3s;
  }
  .tile.flying { z-index: 3; }
  .tile.flying i { transform: scale(1.08); box-shadow: 0 14px 28px rgba(0,0,0,.35); }
  .tile.flag i { background: linear-gradient(155deg, #fffaf0, var(--tile-hi) 60%, var(--tile)); }
  .tile.flag.mint i { box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.18), inset 0 0 0 3px var(--mint); }
  .tile.flag.coral i { box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.18), inset 0 0 0 3px var(--coral); }
  .tile svg.pennant { position: absolute; inset: 22%; width: 56%; height: 56%; }
  .tile.last i { box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 6px 14px rgba(0,0,0,.18), inset 0 0 0 3px var(--gold); }
  .hole-last {
    position: absolute; width: 20%; height: 20%; left: 0; top: 0;
    transform: translate(calc(var(--c) * 100%), calc(var(--r) * 100%));
  }
  .hole-last span { position: absolute; inset: 30%; border-radius: 50%; border: 2px dashed rgba(255,255,255,.6); }

  .piece { z-index: 4; transition: transform .38s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
  .piece b {
    position: absolute; inset: 17%;
    display: grid; place-items: center; border-radius: 50%;
    box-shadow: 0 4px 0 rgba(0,0,0,.22), 0 8px 16px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.35);
    transition: box-shadow .25s;
  }
  .piece.mint b { background: radial-gradient(circle at 35% 30%, #5fe0b6, var(--mint) 55%, var(--mint-deep)); }
  .piece.coral b { background: radial-gradient(circle at 35% 30%, #ff9a85, var(--coral) 55%, var(--coral-deep)); }
  .piece b svg { width: 46%; height: 46%; }
  .piece.sel b { box-shadow: 0 0 0 4px #fff, 0 0 0 8px var(--gold), 0 0 26px 10px rgba(233,185,73,.55); animation: aura 1.6s ease-in-out infinite; }
  @keyframes aura { 50% { box-shadow: 0 0 0 4px #fff, 0 0 0 8px var(--gold), 0 0 34px 16px rgba(233,185,73,.35); } }
  .piece.pivot b { box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--gold), 0 4px 14px rgba(0,0,0,.25); }
  .piece.won b { box-shadow: 0 0 0 4px #fff, 0 0 40px 18px rgba(233,185,73,.8); }

  .mark { z-index: 5; pointer-events: none; display: grid; place-items: center; }
  .mark.walk::before { content: ''; width: 26%; height: 26%; border-radius: 50%; background: rgba(28,33,48,.55); box-shadow: 0 0 0 4px rgba(255,255,255,.65); }
  .mark.walk.win::before { background: var(--gold); width: 34%; height: 34%; }
  .mark.lift::before { content: ''; position: absolute; inset: 9%; border-radius: 14%; border: 2px dashed rgba(28,33,48,.45); }
  .mark.lift.on::before { border: 3px solid var(--gold); background: rgba(233,185,73,.18); }
  .mark.drop::before { content: ''; position: absolute; inset: 9%; border-radius: 14%; border: 3px dashed rgba(255,255,255,.85); background: rgba(255,255,255,.14); }
  .mark .tag {
    position: absolute; right: 8%; top: 8%;
    font-size: clamp(.6rem, 2.2vw, .8rem); font-weight: 700; line-height: 1;
    padding: 3px 5px; border-radius: 6px; background: #fff; color: var(--ink);
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
  }
  .cellbtn { z-index: 6; background: transparent; border: 0; cursor: default; border-radius: 10px; }
  .cellbtn.act { cursor: pointer; }
  .cellbtn.act:hover { background: rgba(255,255,255,.08); }

  /* Status line under the board */
  .status {
    width: 100%; max-width: 560px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 14px; min-height: 52px;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .dot.mint { background: var(--mint); } .dot.coral { background: var(--coral); }
  .status .msg { flex: 1 1 auto; font-weight: 600; }
  .status .sub { flex: 1 0 100%; font-size: .86rem; color: var(--muted); font-weight: 400; }
  .status.end { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(233,185,73,.25); }
  .thinking::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  /* Side panel */
  aside.panel { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .card h2 { font-family: var(--mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; }
  .row > span { font-size: .9rem; color: var(--body); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; padding: 6px 10px; font-size: .84rem; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .note { font-size: .82rem; color: var(--muted); margin-top: 6px; }
  .note b { color: var(--ink); font-weight: 600; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .btn {
    border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
    padding: 8px 14px; font-weight: 600; font-size: .9rem; cursor: pointer;
  }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.pass { background: var(--gold); border-color: var(--gold); color: #1c2130; }
  ol.log {
    list-style: none; font-family: var(--mono); font-size: .8rem; color: var(--body);
    max-height: 220px; overflow: auto; display: grid; grid-template-columns: auto 1fr 1fr; gap: 2px 10px;
  }
  ol.log li { display: contents; }
  ol.log .n { color: var(--muted); }
  ol.log .m.mint { color: var(--mint-deep); } ol.log .m.coral { color: var(--coral-deep); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) ol.log .m.mint { color: #5fe0b6; } :root:not([data-theme="light"]) ol.log .m.coral { color: #ff9a85; } }
  .empty { font-size: .84rem; color: var(--muted); }
  details.rules summary { cursor: pointer; font-weight: 600; font-size: .92rem; }
  details.rules ol, details.rules ul { margin: 8px 0 0 1.1em; font-size: .88rem; color: var(--body); }
  details.rules li { margin: 4px 0; }

  /* Confirm dialog */
  dialog {
    border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; max-width: 360px;
    background: var(--panel); color: var(--ink); box-shadow: var(--shadow);
    margin: auto;
  }
  dialog::backdrop { background: rgba(10, 12, 18, .45); }
  dialog p { margin-bottom: 14px; }
  footer { max-width: 1080px; margin: 26px auto 0; font-size: .8rem; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .tile, .piece { transition: none; } .piece.sel b { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="../">
      <span class="wordmark">Gambit<em>Aura</em></span>
      <span class="crumb" data-i18n="series">Game 01</span>
    </a>
    <div class="langs" role="group" aria-label="Language">
      <button class="chip" data-lang="zh" aria-pressed="true">中文</button>
      <button class="chip" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main class="game">
    <section class="stage">
      <div class="title-row">
        <h1>借路 <small>Jielu</small></h1>
        <span class="ver" id="ver"></span>
      </div>
      <div class="boardframe">
        <div class="files" aria-hidden="true"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span></div>
        <div class="ranks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
        <div class="board" id="board">
          <div class="layer" id="tiles"></div>
          <div class="layer" id="marks"></div>
          <div class="layer" id="pieces"></div>
          <div class="layer" id="cells" role="grid" aria-label="board"></div>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite">
        <span class="dot" id="turnDot"></span>
        <span class="msg" id="msg"></span>
        <button class="btn pass" id="passBtn" hidden></button>
        <span class="sub" id="sub"></span>
      </div>
    </section>

    <aside class="panel">
      <div class="card">
        <h2 data-i18n="setup">Setup</h2>
        <div class="row"><span data-i18n="mode">Mode</span>
          <div class="seg" id="modeSeg">
            <button data-v="ai" data-i18n="modeAi">vs computer</button>
            <button data-v="pvp" data-i18n="modePvp">Two players</button>
          </div>
        </div>
        <div class="row" id="levelRow"><span data-i18n="level">Computer</span>
          <div class="seg" id="levelSeg">
            <button data-v="easy" data-i18n="easy">Easy</button>
            <button data-v="normal" data-i18n="normal">Normal</button>
            <button data-v="hard" data-i18n="hard">Hard</button>
          </div>
        </div>
        <div class="row"><span data-i18n="opening">Opening</span>
          <div class="seg" id="layoutSeg">
            <button data-v="v05">v0.5</button>
            <button data-v="v04">v0.4</button>
          </div>
        </div>
        <p class="note" id="layoutNote"></p>
        <div class="btns">
          <button class="btn" id="restartBtn" data-i18n="restart">Restart</button>
          <button class="btn primary" id="nextBtn" data-i18n="next" hidden>Next game</button>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="moves">Moves</h2>
        <ol class="log" id="log"></ol>
        <p class="empty" id="logEmpty" data-i18n="noMoves">No moves yet.</p>
      </div>

      <div class="card">
        <details class="rules" id="rules">
          <summary data-i18n="rulesTitle">How to play</summary>
          <div id="rulesBody"></div>
        </details>
      </div>
    </aside>
  </main>

  <footer>
    <span data-i18n="footer1">No dice, no timer, nothing hidden.</span>
    <a href="analysis/" data-i18n="footer2">Fairness check</a>
  </footer>
</div>

<dialog id="drawDlg">
  <p id="drawText"></p>
  <div class="btns">
    <button class="btn" id="drawCancel"></button>
    <button class="btn primary" id="drawOk"></button>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
